services:
  nodejs:
    image: nodejs-mysql:v0.1
    container_name: nodejs
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
        restart: true
    networks:
      - nodejs-mysqldb
    env_file:
      - .env

  mysql:
    image: mysql:latest 
    ports:
      - "3306:3306"
    volumes:
      - mysql_volume:/var/lib/mysql
    container_name: mysqldb
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      timeout: 30s
      retries: 10
      start_period: 30s
      interval: 10s
    networks:
      - nodejs-mysqldb

volumes:
  mysql_volume:

networks:
  nodejs-mysqldb: